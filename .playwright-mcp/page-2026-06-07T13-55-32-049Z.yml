                - listitem [ref=e173]:
                  - generic [ref=e174]: Spring Boot Integration
            - generic [ref=e175]:
              - heading "Spring Boot Integration" [level=1] [ref=e177]
              - paragraph [ref=e178]:
                - text: LangChain4j provides
                - link "Spring Boot starters" [ref=e179] [cursor=pointer]:
                  - /url: https://github.com/langchain4j/langchain4j-spring
                - text: "for:"
              - list [ref=e180]:
                - listitem [ref=e181]: popular integrations
                - listitem [ref=e182]:
                  - text: declarative
                  - link "AI Services" [ref=e183] [cursor=pointer]:
                    - /url: /tutorials/ai-services
              - heading "Spring Boot StartersDirect link to Spring Boot Starters" [level=2] [ref=e184]:
                - text: Spring Boot Starters
                - link "Direct link to Spring Boot Starters" [ref=e185] [cursor=pointer]:
                  - /url: "#spring-boot-starters"
                  - text: "#"
              - paragraph [ref=e186]:
                - text: Spring Boot starters help with creating and configuring
                - link "language models" [ref=e187] [cursor=pointer]:
                  - /url: /category/language-models
                - text: ","
                - link "embedding models" [ref=e188] [cursor=pointer]:
                  - /url: /category/embedding-models
                - text: ","
                - link "embedding stores" [ref=e189] [cursor=pointer]:
                  - /url: /category/embedding-stores
                - text: ", and other core LangChain4j components through properties."
              - paragraph [ref=e190]:
                - text: To use one of the
                - link "Spring Boot starters" [ref=e191] [cursor=pointer]:
                  - /url: https://github.com/langchain4j/langchain4j-spring
                - text: ", import the corresponding dependency."
              - paragraph [ref=e192]: "The naming convention for the Spring Boot starter dependency is:"
              - list [ref=e193]:
                - listitem [ref=e194]:
                  - code [ref=e195]: "langchain4j-{integration-name}-spring-boot-starter"
                  - text: for
                  - strong [ref=e196]: Spring Boot 3
                - listitem [ref=e197]:
                  - code [ref=e198]: "langchain4j-{integration-name}-spring-boot4-starter"
                  - text: for
                  - strong [ref=e199]: Spring Boot 4
              - paragraph [ref=e200]:
                - text: For example, for OpenAI (
                - code [ref=e201]: langchain4j-open-ai
                - text: "):"
              - paragraph [ref=e202]:
                - strong [ref=e203]: "Spring Boot 3:"
              - code [ref=e207]:
                - generic [ref=e208]: <dependency>
                - generic [ref=e209]: <groupId>dev.langchain4j</groupId>
                - generic [ref=e210]: <artifactId>langchain4j-open-ai-spring-boot-starter</artifactId>
                - generic [ref=e211]: <version>1.16.1-beta26</version>
                - generic [ref=e212]: </dependency>
              - paragraph [ref=e213]:
                - strong [ref=e214]: "Spring Boot 4:"
              - code [ref=e218]:
                - generic [ref=e219]: <dependency>
                - generic [ref=e220]: <groupId>dev.langchain4j</groupId>
                - generic [ref=e221]: <artifactId>langchain4j-open-ai-spring-boot4-starter</artifactId>
                - generic [ref=e222]: <version>1.16.1-beta26</version>
                - generic [ref=e223]: </dependency>
              - paragraph [ref=e224]:
                - text: Then, you can configure model parameters in the
                - code [ref=e225]: application.properties
                - text: "file as follows:"
              - code [ref=e229]:
                - generic [ref=e230]: "langchain4j.open-ai.chat-model.api-key=${OPENAI_API_KEY}"
                - generic [ref=e231]: langchain4j.open-ai.chat-model.model-name=gpt-4o
                - generic [ref=e232]: langchain4j.open-ai.chat-model.log-requests=true
                - generic [ref=e233]: langchain4j.open-ai.chat-model.log-responses=true
                - generic [ref=e234]: ...
              - paragraph [ref=e235]:
                - text: In this case, an instance of
                - code [ref=e236]: OpenAiChatModel
                - text: (an implementation of a
                - code [ref=e237]: ChatModel
                - text: ") will be automatically created, and you can autowire it where needed:"
              - code [ref=e241]:
                - generic [ref=e242]: "@RestController"
                - generic [ref=e243]: "public class ChatController {"
                - generic [ref=e245]: ChatModel chatModel;
                - generic [ref=e247]: "public ChatController(ChatModel chatModel) {"
                - generic [ref=e248]: this.chatModel = chatModel;
                - generic [ref=e249]: "}"
                - generic [ref=e251]: "@GetMapping(\"/chat\")"
                - generic [ref=e252]: "public String model(@RequestParam(value = \"message\", defaultValue = \"Hello\") String message) {"
                - generic [ref=e253]: return chatModel.chat(message);
                - generic [ref=e254]: "}"
                - generic [ref=e255]: "}"
              - paragraph [ref=e256]:
                - text: If you need an instance of a
                - code [ref=e257]: StreamingChatModel
                - text: ", use the"
                - code [ref=e258]: streaming-chat-model
                - text: instead of the
                - code [ref=e259]: chat-model
                - text: "properties:"
              - code [ref=e263]:
                - generic [ref=e264]: "langchain4j.open-ai.streaming-chat-model.api-key=${OPENAI_API_KEY}"
                - generic [ref=e265]: ...
              - heading "Spring Boot starter for declarative AI ServicesDirect link to Spring Boot starter for declarative AI Services" [level=2] [ref=e266]:
                - text: Spring Boot starter for declarative AI Services
                - link "Direct link to Spring Boot starter for declarative AI Services" [ref=e267] [cursor=pointer]:
                  - /url: "#spring-boot-starter-for-declarative-ai-services"
                  - text: "#"
              - paragraph [ref=e268]:
                - text: LangChain4j provides a Spring Boot starter for auto-configuring
                - link "AI Services" [ref=e269] [cursor=pointer]:
                  - /url: /tutorials/ai-services
                - text: ","
                - link "RAG" [ref=e270] [cursor=pointer]:
                  - /url: /tutorials/rag
                - text: ","
                - link "Tools" [ref=e271] [cursor=pointer]:
                  - /url: /tutorials/tools
                - text: etc.
              - paragraph [ref=e272]:
                - text: Assuming you have already imported one of the integrations starters (see above), import
                - code [ref=e273]: langchain4j-spring-boot-starter
                - text: (Spring Boot 3) or
                - code [ref=e274]: langchain4j-spring-boot4-starter
                - text: "(Spring Boot 4):"
              - paragraph [ref=e275]:
                - strong [ref=e276]: "Spring Boot 3:"
              - code [ref=e280]:
                - generic [ref=e281]: <dependency>
                - generic [ref=e282]: <groupId>dev.langchain4j</groupId>
                - generic [ref=e283]: <artifactId>langchain4j-spring-boot-starter</artifactId>
                - generic [ref=e284]: <version>1.16.1-beta26</version>
                - generic [ref=e285]: </dependency>
              - paragraph [ref=e286]:
                - strong [ref=e287]: "Spring Boot 4:"
              - code [ref=e291]:
                - generic [ref=e292]: <dependency>
                - generic [ref=e293]: <groupId>dev.langchain4j</groupId>
                - generic [ref=e294]: <artifactId>langchain4j-spring-boot4-starter</artifactId>
                - generic [ref=e295]: <version>1.16.1-beta26</version>
                - generic [ref=e296]: </dependency>
              - paragraph [ref=e297]:
                - text: You can now define AI Service interface and annotate it with
                - code [ref=e298]: "@AiService"
                - text: ":"
              - code [ref=e302]:
                - generic [ref=e303]: "@AiService"
                - generic [ref=e304]: "interface Assistant {"
                - generic [ref=e306]: "@SystemMessage(\"You are a polite assistant\")"
                - generic [ref=e307]: String chat(String userMessage);
                - generic [ref=e308]: "}"
              - paragraph [ref=e309]:
                - text: Think of it as a standard Spring Boot
                - code [ref=e310]: "@Service"
                - text: ", but with AI capabilities."
              - paragraph [ref=e311]:
                - text: When the application starts, LangChain4j starter will scan the classpath and find all interfaces annotated with
                - code [ref=e312]: "@AiService"
                - text: ". For each AI Service found, it will create an implementation of this interface using all LangChain4j components available in the application context and will register it as a bean, so you can auto-wire it where needed:"
              - code [ref=e316]:
                - generic [ref=e317]: "@RestController"
                - generic [ref=e318]: "class AssistantController {"
                - generic [ref=e320]: "@Autowired"
                - generic [ref=e321]: Assistant assistant;
                - generic [ref=e323]: "@GetMapping(\"/chat\")"
                - generic [ref=e324]: "public String chat(String message) {"
                - generic [ref=e325]: return assistant.chat(message);
                - generic [ref=e326]: "}"
                - generic [ref=e327]: "}"
              - heading "Automatic Component WiringDirect link to Automatic Component Wiring" [level=3] [ref=e328]:
                - text: Automatic Component Wiring
                - link "Direct link to Automatic Component Wiring" [ref=e329] [cursor=pointer]:
                  - /url: "#automatic-component-wiring"
                  - text: "#"
              - paragraph [ref=e330]: "The following components will be automatically wired into the AI Service if available in the application context:"
              - list [ref=e331]:
                - listitem [ref=e332]:
                  - code [ref=e333]: ChatModel
                - listitem [ref=e334]:
                  - code [ref=e335]: StreamingChatModel
                - listitem [ref=e336]:
                  - code [ref=e337]: ChatMemory
                - listitem [ref=e338]:
                  - code [ref=e339]: ChatMemoryProvider
                - listitem [ref=e340]:
                  - code [ref=e341]: ContentRetriever
                - listitem [ref=e342]:
                  - code [ref=e343]: RetrievalAugmentor
                - listitem [ref=e344]:
                  - code [ref=e345]: ToolProvider
                - listitem [ref=e346]:
                  - text: All methods of any
                  - code [ref=e347]: "@Component"
                  - text: or
                  - code [ref=e348]: "@Service"
                  - text: class that are annotated with
                  - code [ref=e349]: "@Tool"
                  - text: "An example:"
              - code [ref=e353]:
                - generic [ref=e354]: "@Component"
                - generic [ref=e355]: "public class BookingTools {"
                - generic [ref=e357]: private final BookingService bookingService;
                - generic [ref=e359]: "public BookingTools(BookingService bookingService) {"
                - generic [ref=e360]: this.bookingService = bookingService;
                - generic [ref=e361]: "}"
                - generic [ref=e363]: "@Tool"
                - generic [ref=e364]: "public Booking getBookingDetails(String bookingNumber, String customerName, String customerSurname) {"
                - generic [ref=e365]: return bookingService.getBookingDetails(bookingNumber, customerName, customerSurname);
                - generic [ref=e366]: "}"
                - generic [ref=e368]: "@Tool"
                - generic [ref=e369]: "public void cancelBooking(String bookingNumber, String customerName, String customerSurname) {"
                - generic [ref=e370]: bookingService.cancelBooking(bookingNumber, customerName, customerSurname);
                - generic [ref=e371]: "}"
                - generic [ref=e372]: "}"
              - generic [ref=e373]:
                - generic [ref=e374]:
                  - img [ref=e376]
                  - text: note
                - paragraph [ref=e379]: If multiple components of the same type are present in the application context, the application will fail to start. In this case, use the explicit wiring mode (explained below).
              - heading "Explicit Component WiringDirect link to Explicit Component Wiring" [level=3] [ref=e380]:
                - text: Explicit Component Wiring
                - link "Direct link to Explicit Component Wiring" [ref=e381] [cursor=pointer]:
                  - /url: "#explicit-component-wiring"
                  - text: "#"
              - paragraph [ref=e382]:
                - text: If you have multiple AI Services and want to wire different LangChain4j components into each of them, you can specify which components to use with explicit wiring mode (
                - code [ref=e383]: "@AiService(wiringMode = EXPLICIT)"
                - text: ).
              - paragraph [ref=e384]:
                - text: Let's say we have two
                - code [ref=e385]: ChatModel
                - text: "s configured:"
              - code [ref=e389]:
                - generic [ref=e390]: "# OpenAI"
                - generic [ref=e391]: "langchain4j.open-ai.chat-model.api-key=${OPENAI_API_KEY}"
                - generic [ref=e392]: langchain4j.open-ai.chat-model.model-name=gpt-4o-mini
                - generic [ref=e394]: "# Ollama"
                - generic [ref=e395]: langchain4j.ollama.chat-model.base-url=http://localhost:11434
                - generic [ref=e396]: langchain4j.ollama.chat-model.model-name=llama3.1
              - code [ref=e400]:
                - generic [ref=e401]: "@AiService(wiringMode = EXPLICIT, chatModel = \"openAiChatModel\")"
                - generic [ref=e402]: "interface OpenAiAssistant {"
                - generic [ref=e404]: "@SystemMessage(\"You are a polite assistant\")"
                - generic [ref=e405]: String chat(String userMessage);
                - generic [ref=e406]: "}"
                - generic [ref=e408]: "@AiService(wiringMode = EXPLICIT, chatModel = \"ollamaChatModel\")"
                - generic [ref=e409]: "interface OllamaAssistant {"
                - generic [ref=e411]: "@SystemMessage(\"You are a polite assistant\")"
                - generic [ref=e412]: String chat(String userMessage);
                - generic [ref=e413]: "}"
              - generic [ref=e414]:
                - generic [ref=e415]:
                  - img [ref=e417]
                  - text: note
                - paragraph [ref=e420]:
                  - text: In this case, you must explicitly specify
                  - strong [ref=e421]: all
                  - text: components.
              - paragraph [ref=e422]:
                - text: More details can be found
                - link "here" [ref=e423] [cursor=pointer]:
                  - /url: https://github.com/langchain4j/langchain4j-spring/blob/main/langchain4j-spring-boot-starter/src/main/java/dev/langchain4j/service/spring/AiService.java
                - text: (same API for the Spring Boot 4 variant).
              - heading "Listening for AI Service Registration EventsDirect link to Listening for AI Service Registration Events" [level=3] [ref=e424]:
                - text: Listening for AI Service Registration Events
                - link "Direct link to Listening for AI Service Registration Events" [ref=e425] [cursor=pointer]:
                  - /url: "#listening-for-ai-service-registration-events"
                  - text: "#"
              - paragraph [ref=e426]:
                - text: After you have completed the development of the AI Service in a declarative manner, you can listen for the
                - code [ref=e427]: AiServiceRegisteredEvent
                - text: by implementing the
                - code [ref=e428]: ApplicationListener<AiServiceRegisteredEvent>
                - text: "interface. This event is triggered when AI Service is registered in the Spring context, allowing you to obtain information about all registered AI services and their tools at runtime. Here is an example:"
              - code [ref=e432]:
                - generic [ref=e433]: "@Component"
                - generic [ref=e434]: "class AiServiceRegisteredEventListener implements ApplicationListener<AiServiceRegisteredEvent> {"
                - generic [ref=e437]: "@Override"
