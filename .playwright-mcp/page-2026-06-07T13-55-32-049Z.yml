      - generic [ref=e161]:
        - generic [ref=e163]:
          - article [ref=e164]:
            - navigation "Breadcrumbs" [ref=e165]:
              - list [ref=e166]:
                - listitem [ref=e167]:
                  - link "Home page" [ref=e168] [cursor=pointer]:
                    - /url: /
                    - img [ref=e169]
                - listitem [ref=e171]:
                  - link "Tutorials" [ref=e172] [cursor=pointer]:
